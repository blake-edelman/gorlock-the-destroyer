; Gorlock The Destroyer — ESP32 firmware (PlatformIO + Arduino)
; MCU: ESP32-WROOM-32 (Blake confirmed)
; PlatformIO board id `esp32dev` is the standard match for WROOM-32 DevKit-style modules.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=0
lib_ldf_mode = deep+
